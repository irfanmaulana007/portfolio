server {
  # 8080, not 80 — the container runs as the non-root nginx user.
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: serve index.html for any client-side route.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache hashed static assets aggressively.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
